# Configuración de despliegue en Netlify.
# Netlify lee este archivo al importar el repositorio: no hace falta
# rellenar nada a mano en su interfaz.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

# Cabeceras de seguridad para todas las páginas.
# Un sitio estático no tiene base de datos ni sesiones: estas cabeceras
# cierran lo poco que queda (scripts ajenos, iframes, MIME sniffing).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # CSP en modo "sólo informar": el navegador registra las infracciones en
    # la consola pero no bloquea nada. Tras comprobar todas las páginas sin
    # avisos, cambiar el nombre de la cabecera a Content-Security-Policy.
    # 'unsafe-inline' en script-src hace falta para los gráficos exportados
    # desde Python, que llevan su propio <script> dentro del HTML.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Caché larga para recursos con hash en el nombre y para Plotly.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
