<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="13">
  <rect width="800" height="440" fill="#fdfdfc"/>
  <text x="40" y="34" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111214">Figura de demostración</text>
  <text x="40" y="56" fill="#6f7379">Dos series ficticias, 2016–2025. Sirve sólo para comprobar la plantilla.</text>
  <!-- ejes -->
  <g stroke="#d9dbde" stroke-width="1">
    <line x1="70" y1="100" x2="760" y2="100"/>
    <line x1="70" y1="170" x2="760" y2="170"/>
    <line x1="70" y1="240" x2="760" y2="240"/>
    <line x1="70" y1="310" x2="760" y2="310"/>
    <line x1="70" y1="380" x2="760" y2="380"/>
  </g>
  <g fill="#8a8e95" text-anchor="end">
    <text x="62" y="104">40</text>
    <text x="62" y="174">30</text>
    <text x="62" y="244">20</text>
    <text x="62" y="314">10</text>
    <text x="62" y="384">0</text>
  </g>
  <g fill="#8a8e95" text-anchor="middle">
    <text x="105" y="404">2016</text>
    <text x="177" y="404">2017</text>
    <text x="249" y="404">2018</text>
    <text x="321" y="404">2019</text>
    <text x="393" y="404">2020</text>
    <text x="465" y="404">2021</text>
    <text x="537" y="404">2022</text>
    <text x="609" y="404">2023</text>
    <text x="681" y="404">2024</text>
    <text x="753" y="404">2025</text>
  </g>
  <!-- serie B (gris) -->
  <polyline fill="none" stroke="#8a8e95" stroke-width="2" points="105,290 177,282 249,296 321,270 393,310 465,275 537,268 609,262 681,255 753,258"/>
  <!-- serie A (azul) -->
  <polyline fill="none" stroke="#1c5bb8" stroke-width="2.5" points="105,300 177,288 249,275 321,262 393,282 465,240 537,222 609,205 681,190 753,176"/>
  <g fill="#1c5bb8">
    <circle cx="753" cy="176" r="4"/>
  </g>
  <text x="745" y="166" fill="#1c5bb8" text-anchor="end">Serie A</text>
  <text x="745" y="248" fill="#8a8e95" text-anchor="end">Serie B</text>
  <text x="40" y="430" fill="#8a8e95" font-size="11">Fuente: datos inventados. Caesius.</text>
</svg>
